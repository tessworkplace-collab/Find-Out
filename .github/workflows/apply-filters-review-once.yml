name: Apply filters and review once

on:
  push:
    branches:
      - codex/mission-difficulty
    paths:
      - .github/workflows/apply-filters-review-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/mission-difficulty
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/add_filters_review.py

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Verify diff
        run: git diff --check

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NativeApp.tsx src/discoveryStorage.ts
          git commit -m "feat: add mission filters and review flow"
          git push origin HEAD:codex/mission-difficulty
