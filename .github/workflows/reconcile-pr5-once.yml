name: Reconcile PR5 once

on:
  push:
    branches:
      - codex/mission-difficulty
    paths:
      - .github/workflows/reconcile-pr5-once.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/mission-difficulty
          fetch-depth: 0

      - name: Restore completed-discoveries implementation from main
        run: |
          git fetch origin main
          git checkout origin/main -- NativeApp.tsx src/discoveryStorage.ts

      - name: Integrate mission difficulty with current native and web flows
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          native_path = Path('NativeApp.tsx')
          native = native_path.read_text()

          native = replace_once(
              native,
              "const DEFAULT_OBSERVATION = 'The crossing signal carries farther than I noticed.';",
              "const DEFAULT_OBSERVATION = '';",
              'native default observation',
          )
          native = replace_once(
              native,
              "const [captureMode, setCaptureMode] = useState<CaptureMode>('audio');",
              "const [captureMode, setCaptureMode] = useState<CaptureMode>('photo');",
              'native initial capture mode',
          )
          native = replace_once(
              native,
              "    setCaptureMode('audio');",
              "    setCaptureMode('photo');",
              'native reset capture mode',
          )

          category_refs = native.count('activeMission.category')
          if category_refs != 3:
              raise SystemExit(f'native mission metadata: expected 3 category refs, found {category_refs}')
          native = native.replace('activeMission.category', 'activeMission.difficulty')

          native = replace_once(
              native,
              '<AppText style={styles.h1}>Follow the signal</AppText>',
              '<AppText style={styles.h1}>Look closer</AppText>',
              'native investigate heading',
          )
          native = replace_once(
              native,
              '<AppText style={styles.body}>Move slowly. Let one detail lead you to the next.</AppText>',
              '<AppText style={styles.body}>Use the mission question as a guide, then follow the clues you notice.</AppText>',
              'native investigate intro',
          )
          native = replace_once(
              native,
              '<AppText style={styles.h3}>What familiar sound are you following?</AppText>',
              '<AppText style={styles.h3}>{activeMission.question}</AppText>',
              'native investigate question',
          )
          native = replace_once(
              native,
              '<AppText style={styles.label}>Pay closer attention</AppText>',
              '<AppText style={styles.label}>Keep investigating</AppText>',
              'native investigate guidance title',
          )
          native = replace_once(
              native,
              '<AppText style={styles.body}>Notice what stands out, then decide what matters.</AppText>',
              '<AppText style={styles.body}>{activeMission.guidance}</AppText>',
              'native investigate guidance body',
          )
          native = replace_once(
              native,
              """            <TextInput
              multiline
              value={observation}
              onChangeText={setObservation}
              style={styles.input}
            />""",
              """            <TextInput
              multiline
              value={observation}
              onChangeText={setObservation}
              placeholder="What did you notice?"
              placeholderTextColor={colors.muted}
              style={styles.input}
            />""",
              'native observation placeholder',
          )

          if 'activeMission.category' in native:
              raise SystemExit('native still contains activeMission.category')
          native_path.write_text(native)

          app_path = Path('App.tsx')
          app = app_path.read_text()
          app = replace_once(
              app,
              '<AppText style={styles.h1}>Follow the signal</AppText>',
              '<AppText style={styles.h1}>Look closer</AppText>',
              'web investigate heading',
          )
          app = replace_once(
              app,
              '              Move slowly. Let one detail lead you to the next.',
              '              Use the mission question as a guide, then follow the clues you notice.',
              'web investigate intro',
          )
          app = replace_once(
              app,
              '            What familiar sound are you following?',
              '            {activeMission.question}',
              'web investigate question',
          )
          app = replace_once(
              app,
              '<AppText style={styles.guidanceTitle}>Pay closer attention</AppText>',
              '<AppText style={styles.guidanceTitle}>Keep investigating</AppText>',
              'web investigate guidance title',
          )
          app = replace_once(
              app,
              '            Notice what stands out, then decide what matters.',
              '            {activeMission.guidance}',
              'web investigate guidance body',
          )
          app = replace_once(
              app,
              "let pendingCapture: CaptureMode = 'audio';",
              "let pendingCapture: CaptureMode = 'photo';",
              'web pending capture mode',
          )
          app = replace_once(
              app,
              '<AppText style={styles.eyebrow}>A SOUND YOU KNOW</AppText>',
              '<AppText style={styles.eyebrow}>{activeMission.title.toUpperCase()}</AppText>',
              'web other discoveries mission label',
          )
          app = replace_once(
              app,
              '          Notice a familiar sound you hear often but rarely pay attention to.',
              '          {activeMission.summary}',
              'web other discoveries summary',
          )
          app = replace_once(
              app,
              '<AppText style={styles.eyebrow}>A SOUND YOU KNOW  ·  SAME MISSION</AppText>',
              '<AppText style={styles.eyebrow}>{activeMission.title.toUpperCase()} · SAME MISSION</AppText>',
              'web discovery detail mission label',
          )
          app_path.write_text(app)
          PY

      - name: Verify integrated branch
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          git diff --check
          test -f src/discoveryStorage.ts

      - name: Commit reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx NativeApp.tsx src/discoveryStorage.ts
          git commit -m "fix: integrate mission difficulty with discoveries flow"
          git push origin HEAD:codex/mission-difficulty
