name: Apply fixed mission numbers once

on:
  push:
    branches:
      - codex/mission-difficulty
    paths:
      - .github/workflows/apply-fixed-mission-numbers-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/mission-difficulty
          fetch-depth: 0

      - name: Apply fixed mission number patch
        run: python .github/scripts/fixed_mission_numbers.py

      - name: Install dependencies
        run: npm install

      - name: Typecheck app
        run: npm run typecheck

      - name: Verify diff
        run: git diff --check

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NativeApp.tsx
          git commit -m "feat: show fixed mission numbers and simplify filters"
          git push origin HEAD:codex/mission-difficulty
