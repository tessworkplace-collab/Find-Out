name: Finish PR5 once

on:
  push:
    branches:
      - codex/mission-difficulty
    paths:
      - .github/workflows/finish-pr5-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/mission-difficulty
          fetch-depth: 0
      - name: Apply final integration
        run: python .github/scripts/finish_pr5.py
      - name: Install dependencies
        run: npm install
      - name: Typecheck app
        run: npm run typecheck
      - name: Verify diff
        run: git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx NativeApp.tsx
          git commit -m "feat: finish mission rotation and evidence states"
          git push origin HEAD:codex/mission-difficulty
