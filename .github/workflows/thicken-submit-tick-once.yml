name: Thicken submit tick once

on:
  push:
    branches:
      - codex/mission-difficulty
    paths:
      - .github/workflows/thicken-submit-tick-once.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/mission-difficulty
          fetch-depth: 0

      - name: Use a stronger completion tick
        run: |
          python - <<'PY'
          from pathlib import Path

          changes = [
              ('NativeApp.tsx', '<Ionicons name="checkmark" size={34} color={colors.ink} />', '<MaterialIcons name="check" size={46} color={colors.ink} />'),
              ('App.tsx', '<Ionicons name="checkmark" size={28} color={colors.ink} />', '<MaterialIcons name="check" size={34} color={colors.ink} />'),
          ]

          for filename, old, new in changes:
              path = Path(filename)
              text = path.read_text()
              if text.count("import { Ionicons } from '@expo/vector-icons';") != 1:
                  raise SystemExit(f'{filename}: vector icon import mismatch')
              text = text.replace(
                  "import { Ionicons } from '@expo/vector-icons';",
                  "import { Ionicons, MaterialIcons } from '@expo/vector-icons';",
                  1,
              )
              if text.count(old) != 1:
                  raise SystemExit(f'{filename}: completion tick match mismatch')
              text = text.replace(old, new, 1)
              path.write_text(text)
          PY

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Verify diff
        run: git diff --check

      - name: Commit polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NativeApp.tsx App.tsx
          git commit -m "style: strengthen completion checkmark"
          git push origin HEAD:codex/mission-difficulty
