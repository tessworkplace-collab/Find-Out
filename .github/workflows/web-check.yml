name: Expo web check

on:
  pull_request:
  push:
    branches:
      - main
      - feat/initial-expo-prototype
      - codex/mission-difficulty

permissions:
  contents: write

jobs:
  patch-test-missions:
    if: github.event_name == 'push' && github.event.head_commit.message == 'chore: run mission test picker patch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/mission-difficulty
          fetch-depth: 0

      - name: Apply mission picker patch
        run: python .github/scripts/add_test_missions.py

      - name: Install dependencies
        run: npm install

      - name: Typecheck app
        run: npm run typecheck

      - name: Verify diff
        run: git diff --check

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NativeApp.tsx src/draftStorage.ts
          git commit -m "feat: add selectable missions for native testing"
          git push origin HEAD:codex/mission-difficulty

  web-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Typecheck app
        run: npm run typecheck

      - name: Export web build
        run: npm run web:export

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: find-out-web-build
          path: dist