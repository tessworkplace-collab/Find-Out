name: Polish My Discoveries once

on:
  push:
    branches:
      - feat/completed-discoveries
    paths:
      - .github/workflows/polish-discoveries-once.yml

permissions:
  contents: write

jobs:
  polish-discoveries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/completed-discoveries
          fetch-depth: 0
      - run: python .github/scripts/polish_discoveries.py
      - run: npm install --no-audit --no-fund && npm run typecheck
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NativeApp.tsx
          git diff --cached --check
          git commit -m "style: turn My Discoveries into a field journal"
          git push origin HEAD:feat/completed-discoveries
