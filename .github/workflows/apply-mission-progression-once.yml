name: Sync Figma graphics once

on:
  push:
    branches:
      - codex/mission-difficulty
    paths:
      - .github/workflows/apply-mission-progression-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/mission-difficulty
          fetch-depth: 0

      - name: Apply Figma graphic sync
        run: python .github/scripts/sync_figma_graphics.py

      - name: Install dependencies
        run: npm install

      - name: Typecheck app
        run: npm run typecheck

      - name: Export Expo web
        run: npx expo export --platform web --output-dir /tmp/findout-web

      - name: Verify diff
        run: git diff --check

      - name: Commit synced UI and clean one-off files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NativeApp.tsx src/theme.ts
          git rm .github/scripts/sync_figma_graphics.py
          git rm .github/workflows/apply-mission-progression-once.yml
          git commit -m "style: sync native UI with Figma graphics"
          git push origin HEAD:codex/mission-difficulty
