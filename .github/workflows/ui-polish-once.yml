name: UI hierarchy polish once

on:
  push:
    branches:
      - codex/mission-difficulty
    paths:
      - .github/workflows/ui-polish-once.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/mission-difficulty
          fetch-depth: 0

      - name: Apply visual hierarchy polish
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def sub1(text, pattern, replacement, label, flags=0):
              new, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return new

          # Shared type scale: fewer competing sizes and a clearer hierarchy.
          theme = Path('src/theme.ts')
          s = theme.read_text()
          s = sub1(
              s,
              r"export const typography = \{.*?\n\};",
              """export const typography = {
            h1: { fontFamily: 'Archivo_600SemiBold', fontSize: 30, lineHeight: 36, letterSpacing: -0.24 },
            h2: { fontFamily: 'Archivo_600SemiBold', fontSize: 22, lineHeight: 28, letterSpacing: -0.08 },
            h3: { fontFamily: 'Archivo_600SemiBold', fontSize: 18, lineHeight: 24 },
            body: { fontFamily: 'Inter_400Regular', fontSize: 15, lineHeight: 22 },
            bodyMedium: { fontFamily: 'Inter_500Medium', fontSize: 15, lineHeight: 22 },
            label: { fontFamily: 'Inter_500Medium', fontSize: 13, lineHeight: 18 },
            small: { fontFamily: 'Inter_400Regular', fontSize: 12, lineHeight: 18 },
            tiny: { fontFamily: 'Inter_500Medium', fontSize: 10, lineHeight: 14 },
            button: { fontFamily: 'Inter_700Bold', fontSize: 14, lineHeight: 18 },
          };""",
              'shared typography',
              re.S,
          )
          theme.write_text(s)

          native = Path('NativeApp.tsx')
          s = native.read_text()

          s = sub1(
              s,
              r"function MissionNumberMark\(\{ number \}: \{ number: string \}\) \{.*?\n\}\n\nfunction PrimaryButton",
              """function MissionNumberMark({ number }: { number: string }) {
            return (
              <View style={styles.missionNumberMark}>
                <View style={styles.missionNumberRule} />
                <View style={styles.missionNumberCopy}>
                  <AppText style={styles.missionNumberWord}>MISSION</AppText>
                  <AppText style={styles.missionNumberDigits}>{number}</AppText>
                </View>
              </View>
            );
          }

          function PrimaryButton""",
              'mission number component',
              re.S,
          )

          # Remove redundant Rotating Pick micro-label; FEATURED MISSION already gives context.
          s = sub1(
              s,
              r"\s*<View style=\{\{ gap: 5 \}\}>\s*<MissionNumberMark number=\{featuredMission\.number\} />\s*<AppText style=\{styles\.archiveLabel\}>ROTATING PICK</AppText>\s*</View>",
              "\n            <MissionNumberMark number={featuredMission.number} />",
              'featured mission meta cleanup',
              re.S,
          )

          s = s.replace("content: { padding: 24, gap: 18, paddingBottom: 48 },", "content: { padding: 24, gap: 16, paddingBottom: 48 },")
          s = s.replace("topTitle: { flex: 1, textAlign: 'center', fontFamily: 'Inter_700Bold', fontSize: 14 },", "topTitle: { flex: 1, textAlign: 'center', fontFamily: 'Inter_700Bold', fontSize: 14, lineHeight: 18, letterSpacing: 0.1 },")
          s = s.replace("h2: { fontFamily: 'Archivo_600SemiBold', fontSize: 26, lineHeight: 32 },", "h2: { ...typography.h2 },")

          s = sub1(
              s,
              r"  badge: \{.*?\n  \},\n  badgeText: \{.*?\},",
              """  badge: {
            alignSelf: 'flex-start',
            backgroundColor: colors.blueSubtle,
            borderRadius: radius.full,
            paddingHorizontal: 11,
            paddingVertical: 6,
          },
          badgeText: { ...typography.tiny, color: colors.blue, letterSpacing: 0.55 },""",
              'difficulty badge',
              re.S,
          )

          s = sub1(
              s,
              r"  missionCard: \{.*?\n  \},\n  openMission:",
              """  missionCard: {
            borderWidth: 1,
            borderColor: colors.border,
            borderRadius: radius.lg,
            padding: 18,
            gap: 11,
            backgroundColor: colors.white,
          },
          openMission:""",
              'mission card',
              re.S,
          )
          s = s.replace("openMission: { ...typography.label, color: colors.blue, marginTop: 6 },", "openMission: { ...typography.label, color: colors.blue, marginTop: 3 },")
          s = s.replace("featuredObservation: { ...typography.body, color: colors.ink, fontSize: 17, lineHeight: 25 },", "featuredObservation: { ...typography.bodyMedium, color: colors.ink },")
          s = s.replace("discoveryNumber: { fontFamily: 'Archivo_600SemiBold', fontSize: 20, color: colors.muted },", "discoveryNumber: { ...typography.tiny, color: colors.muted, letterSpacing: 0.8 },")

          # Mission identity: lime is a thin visual signature, never a floating slab.
          s = sub1(
              s,
              r"  todayMissionCard: \{.*?\n  filterRail:",
              """  todayMissionCard: {
            borderColor: colors.borderStrong,
            borderLeftWidth: 3,
            borderLeftColor: colors.lime,
            backgroundColor: colors.white,
          },
          featuredMissionMeta: { flexDirection: 'row', alignItems: 'center', justifyContent: 'space-between' },
          missionIdentityRow: { flexDirection: 'row', alignItems: 'center', justifyContent: 'space-between', gap: 12 },
          missionNumberMark: { flexDirection: 'row', alignItems: 'center', gap: 9 },
          missionNumberRule: {
            width: 3,
            height: 34,
            borderRadius: radius.full,
            backgroundColor: colors.lime,
          },
          missionNumberCopy: { gap: 0 },
          missionNumberWord: {
            ...typography.tiny,
            color: colors.muted,
            letterSpacing: 1.15,
          },
          missionNumberDigits: {
            fontFamily: 'Archivo_600SemiBold',
            fontSize: 22,
            lineHeight: 24,
            color: colors.ink,
            letterSpacing: 0.2,
          },
          filterRail:""",
              'mission identity styles',
              re.S,
          )

          s = s.replace("filterChipActive: { backgroundColor: colors.ink, borderColor: colors.ink },", "filterChipActive: { backgroundColor: colors.blueSubtle, borderColor: colors.blue },")
          s = s.replace("filterChipTextActive: { color: colors.white },", "filterChipTextActive: { color: colors.blue },")

          native.write_text(s)
          PY

      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Export web
        run: npm run web:export
      - name: Verify diff
        run: git diff --check
      - name: Commit polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/theme.ts NativeApp.tsx
          git commit -m "style: refine mission identity and type hierarchy"
          git push origin HEAD:codex/mission-difficulty
